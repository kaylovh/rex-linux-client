license = "MIT"

[workspace.dependencies]
ghostty-vt = "=0.9.0"
gpui-kit = "=0.8.1"
serde_json = "1"
async-channel = "2"
base64 = "0.22"
sha1 = "0.10"
getrandom = "0.3"
libc = "0.2"
