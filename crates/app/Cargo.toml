[package]
name = "rexa-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
# Syntax highlighting for previews (the same gpui-component gpui-kit uses, with grammars on).
gpui-component = { version = "=0.8.1", features = [
    "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx",
    "tree-sitter-yaml", "tree-sitter-toml", "tree-sitter-bash", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp",
    "tree-sitter-markdown", "tree-sitter-html", "tree-sitter-css", "tree-sitter-sql", "tree-sitter-java", "tree-sitter-lua",
    "tree-sitter-make", "tree-sitter-zig",
] }
gpui-cn = { path = "../../vendor/gpui-cn", features = ["ghostty", "jetbrains-mono"] }
rex-proto = { path = "../rex-proto" }
rexterm = { path = "../rexterm" }
rex-client = { path = "../rex-client" }
files = { path = "../files" }
serde.workspace = true
serde_json.workspace = true
